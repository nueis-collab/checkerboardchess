<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>체커보드체스 멀티플레이</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:#87ceeb;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
}

#ui{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  background:rgba(0,0,0,0.45);
  padding:10px 18px;
  border-radius:18px;
  color:white;
  display:flex;
  gap:20px;
  align-items:center;
  backdrop-filter:blur(8px);
}

#attackBtn{
  position:fixed;
  right:30px;
  bottom:30px;
  width:90px;
  height:90px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,#ff2d55,#ff6b81);
  color:white;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 8px 20px rgba(0,0,0,0.3);
  z-index:10;
}

#title{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  color:white;
  font-size:42px;
  font-weight:bold;
  text-shadow:0 0 20px rgba(0,0,0,0.4);
  z-index:20;
  text-align:center;
}

#startBtn{
  margin-top:20px;
  padding:14px 32px;
  border:none;
  border-radius:40px;
  font-size:20px;
  background:#00c853;
  color:white;
  cursor:pointer;
}

#roomInput{
  margin-top:15px;
  padding:12px;
  width:240px;
  border:none;
  border-radius:12px;
}

#joinBtn{
  margin-top:10px;
  padding:12px 24px;
  border:none;
  border-radius:12px;
  background:#2979ff;
  color:white;
  cursor:pointer;
}

#gameOver{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:white;
  z-index:30;
}

#restartBtn{
  padding:14px 32px;
  border:none;
  border-radius:30px;
  font-size:20px;
  background:#2979ff;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="title">
  🏰 체커보드체스 멀티플레이

  <br>

  <button id="startBtn">
    방 만들기
  </button>

  <br>

  <input id="roomInput" placeholder="방 코드 입력">

  <br>

  <button id="joinBtn">
    방 참가
  </button>
</div>

<div id="ui">
  <div id="lifeText">❤️❤️❤️❤️❤️</div>
  <div id="roomText">방 없음</div>
</div>

<button id="attackBtn">공격</button>

<div id="gameOver">
  <h1>GAME OVER</h1>
  <button id="restartBtn">
    다시하기
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCV58PRAAt3qF0K-vO31ojkWGPeWlWnVPg",
  authDomain: "fanchess.firebaseapp.com",
  projectId: "fanchess",
  storageBucket: "fanchess.firebasestorage.app",
  messagingSenderId: "213546842690",
  appId: "1:213546842690:web:d4df27cc103376b9b88bdb"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const TILE_SIZE = 2.6;
const BOARD_SIZE = 8;
const PLAYER_SPEED = 4;
const MAX_LIFE = 5;

let scene,camera,renderer;
let board=[];
let player;
let keys={};
let running=false;

let roomId=null;

const playerId=
  Math.random().toString(36).substring(2,9);

let otherPlayers={};

let playerData={
  row:1,
  col:1,
  life:MAX_LIFE
};

init();

function init(){

  scene=new THREE.Scene();

  camera=new THREE.PerspectiveCamera(
    60,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
  );

  camera.position.set(0,11,8);

  renderer=new THREE.WebGLRenderer({
    antialias:true
  });

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  document.body.appendChild(
    renderer.domElement
  );

  const ambient=
    new THREE.AmbientLight(
      0xffffff,
      0.8
    );

  scene.add(ambient);

  const dir=
    new THREE.DirectionalLight(
      0xffffff,
      1.2
    );

  dir.position.set(10,20,10);

  scene.add(dir);

  createBoard();
  createPlayer();

  window.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;
  });

  window.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
  });

  document
  .getElementById("attackBtn")
  .onclick=attack;

  document
  .getElementById("restartBtn")
  .onclick=()=>{
    location.reload();
  };

  document
  .getElementById("startBtn")
  .onclick=createRoom;

  document
  .getElementById("joinBtn")
  .onclick=joinRoom;
}

function createBoard(){

  const offset=(BOARD_SIZE-1)/2;

  for(let r=0;r<BOARD_SIZE;r++){

    board[r]=[];

    for(let c=0;c<BOARD_SIZE;c++){

      const geo=
        new THREE.BoxGeometry(
          TILE_SIZE,
          0.25,
          TILE_SIZE
        );

      const mat=
        new THREE.MeshPhongMaterial({
          color:
          (r+c)%2===0
          ?0xf5e6c8
          :0x9c6736
        });

      const tile=
        new THREE.Mesh(geo,mat);

      tile.position.set(
        (c-offset)*TILE_SIZE,
        0,
        (r-offset)*TILE_SIZE
      );

      scene.add(tile);

      board[r][c]=tile;
    }
  }
}

function createPlayer(){

  player=new THREE.Mesh(
    new THREE.SphereGeometry(0.7,16,16),
    new THREE.MeshPhongMaterial({
      color:0xff2d55
    })
  );

  player.position.y=1;

  scene.add(player);
}

function updatePlayerPosition(){

  const offset=(BOARD_SIZE-1)/2;

  player.position.x=
    (playerData.col-offset)
    *TILE_SIZE;

  player.position.z=
    (playerData.row-offset)
    *TILE_SIZE;
}

function animate(){

  requestAnimationFrame(animate);

  if(running){

    movePlayer();

    player.position.y=
      1+
      Math.sin(Date.now()*0.005)
      *0.08;
  }

  renderer.render(scene,camera);
}

function movePlayer(){

  let moved=false;

  if(keys["w"]){
    playerData.row-=0.05*PLAYER_SPEED;
    moved=true;
  }

  if(keys["s"]){
    playerData.row+=0.05*PLAYER_SPEED;
    moved=true;
  }

  if(keys["a"]){
    playerData.col-=0.05*PLAYER_SPEED;
    moved=true;
  }

  if(keys["d"]){
    playerData.col+=0.05*PLAYER_SPEED;
    moved=true;
  }

  playerData.row=Math.max(
    0,
    Math.min(7,playerData.row)
  );

  playerData.col=Math.max(
    0,
    Math.min(7,playerData.col)
  );

  if(moved){

    updatePlayerPosition();

    syncPlayer();
  }
}

function attack(){

  const r=Math.round(playerData.row);

  for(let c=0;c<BOARD_SIZE;c++){

    const tile=board[r][c];

    tile.material.emissive=
      new THREE.Color(0xff2d55);

    setTimeout(()=>{

      tile.visible=false;

      setTimeout(()=>{

        tile.visible=true;

        tile.material.emissive=
          new THREE.Color(0x000000);

      },3000);

    },c*150);
  }
}

function createRoom(){

  roomId=
    Math.random()
    .toString(36)
    .substring(2,7);

  startGame();
}

function joinRoom(){

  roomId=
    document
    .getElementById("roomInput")
    .value
    .trim();

  if(!roomId)return;

  startGame();
}

function startGame(){

  running=true;

  document
  .getElementById("title")
  .style.display="none";

  document
  .getElementById("roomText")
  .textContent=
    "방: "+roomId;

  listenPlayers();

  animate();
}

function syncPlayer(){

  if(!roomId)return;

  set(
    ref(
      db,
      "rooms/"+roomId+"/players/"+playerId
    ),
    {
      row:playerData.row,
      col:playerData.col
    }
  );
}

function listenPlayers(){

  const roomRef=
    ref(
      db,
      "rooms/"+roomId+"/players"
    );

  onValue(roomRef,snapshot=>{

    const data=snapshot.val();

    if(!data)return;

    for(const id in data){

      if(id===playerId)continue;

      if(!otherPlayers[id]){

        const mesh=
          new THREE.Mesh(
            new THREE.SphereGeometry(0.7,16,16),
            new THREE.MeshPhongMaterial({
              color:0x2979ff
            })
          );

        mesh.position.y=1;

        scene.add(mesh);

        otherPlayers[id]=mesh;
      }

      const p=data[id];

      const offset=(BOARD_SIZE-1)/2;

      otherPlayers[id].position.x=
        (p.col-offset)
        *TILE_SIZE;

      otherPlayers[id].position.z=
        (p.row-offset)
        *TILE_SIZE;
    }
  });
}

</script>

</body>
</html>
