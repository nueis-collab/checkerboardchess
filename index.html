<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>체커보드 멀티플레이</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#87ceeb;
}

canvas{
  display:block;
}

#ui{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  background:rgba(0,0,0,0.45);
  color:white;
  padding:10px 20px;
  border-radius:20px;
  display:flex;
  gap:15px;
  align-items:center;
  backdrop-filter:blur(8px);
}

#roomUI{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  padding:30px;
  border-radius:20px;
  z-index:20;
  width:320px;
  text-align:center;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ccc;
}

button{
  margin-top:10px;
  padding:12px 20px;
  border:none;
  border-radius:12px;
  background:#2979ff;
  color:white;
  cursor:pointer;
  font-size:16px;
}

#attackBtn{
  position:fixed;
  right:30px;
  bottom:30px;
  width:90px;
  height:90px;
  border-radius:50%;
  background:#ff2d55;
  color:white;
  border:none;
  font-size:20px;
  z-index:10;
}

</style>
</head>
<body>

<div id="ui">
  <div id="roomText">방: 없음</div>
</div>

<div id="roomUI">
  <h2>체커보드 멀티플레이</h2>

  <button onclick="createRoom()">
    방 만들기
  </button>

  <input id="roomInput" placeholder="방 코드 입력">

  <button onclick="joinRoom()">
    방 참가
  </button>
</div>

<button id="attackBtn">공격</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCV58PRAAt3qF0K-vO31ojkWGPeWlWnVPg",
  authDomain: "fanchess.firebaseapp.com",
  projectId: "fanchess",
  storageBucket: "fanchess.firebasestorage.app",
  messagingSenderId: "213546842690",
  appId: "1:213546842690:web:d4df27cc103376b9b88bdb"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const TILE_SIZE=2.5;
const BOARD_SIZE=8;

let scene,camera,renderer;
let board=[];

let keys={};

let playerId=
  Math.random().toString(36).substring(2,9);

let roomId=null;

let playerMesh;

let otherPlayers={};

let playerData={
  row:1,
  col:1
};

init();

function init(){

  scene=new THREE.Scene();

  camera=new THREE.PerspectiveCamera(
    60,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
  );

  camera.position.set(0,12,10);

  renderer=new THREE.WebGLRenderer({
    antialias:true
  });

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  document.body.appendChild(
    renderer.domElement
  );

  const light=new THREE.DirectionalLight(
    0xffffff,
    1.2
  );

  light.position.set(10,20,10);

  scene.add(light);

  scene.add(
    new THREE.AmbientLight(0xffffff,0.7)
  );

  createBoard();
  createPlayer();

  window.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;
  });

  window.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
  });

  animate();
}

function createBoard(){

  const offset=(BOARD_SIZE-1)/2;

  for(let r=0;r<BOARD_SIZE;r++){

    board[r]=[];

    for(let c=0;c<BOARD_SIZE;c++){

      const geo=
        new THREE.BoxGeometry(
          TILE_SIZE,
          0.3,
          TILE_SIZE
        );

      const mat=
        new THREE.MeshPhongMaterial({
          color:
          (r+c)%2===0
          ?0xf5e6c8
          :0x9c6736
        });

      const tile=
        new THREE.Mesh(geo,mat);

      tile.position.set(
        (c-offset)*TILE_SIZE,
        0,
        (r-offset)*TILE_SIZE
      );

      scene.add(tile);
    }
  }
}

function createPlayer(){

  playerMesh=new THREE.Mesh(
    new THREE.SphereGeometry(0.7,16,16),
    new THREE.MeshPhongMaterial({
      color:0xff2d55
    })
  );

  playerMesh.position.y=1;

  scene.add(playerMesh);
}

function updatePlayer(){

  if(keys["w"]) playerData.row-=0.05;
  if(keys["s"]) playerData.row+=0.05;
  if(keys["a"]) playerData.col-=0.05;
  if(keys["d"]) playerData.col+=0.05;

  playerData.row=Math.max(
    0,
    Math.min(7,playerData.row)
  );

  playerData.col=Math.max(
    0,
    Math.min(7,playerData.col)
  );

  const offset=(BOARD_SIZE-1)/2;

  playerMesh.position.x=
    (playerData.col-offset)*TILE_SIZE;

  playerMesh.position.z=
    (playerData.row-offset)*TILE_SIZE;

  if(roomId){

    set(
      ref(
        db,
        "rooms/"+roomId+"/players/"+playerId
      ),
      {
        row:playerData.row,
        col:playerData.col
      }
    );
  }
}

function animate(){

  requestAnimationFrame(animate);

  updatePlayer();

  renderer.render(scene,camera);
}

window.createRoom=function(){

  roomId=
    Math.random()
    .toString(36)
    .substring(2,7);

  startMultiplayer();

  alert("방 코드: "+roomId);
}

window.joinRoom=function(){

  roomId=
    document
    .getElementById("roomInput")
    .value
    .trim();

  if(!roomId)return;

  startMultiplayer();
}

function startMultiplayer(){

  document.getElementById(
    "roomUI"
  ).style.display="none";

  document.getElementById(
    "roomText"
  ).textContent=
    "방: "+roomId;

  const roomRef=
    ref(db,"rooms/"+roomId+"/players");

  onValue(roomRef,snapshot=>{

    const data=snapshot.val();

    if(!data)return;

    for(const id in data){

      if(id===playerId)continue;

      if(!otherPlayers[id]){

        const mesh=
          new THREE.Mesh(
            new THREE.SphereGeometry(0.7,16,16),
            new THREE.MeshPhongMaterial({
              color:0x2979ff
            })
          );

        mesh.position.y=1;

        scene.add(mesh);

        otherPlayers[id]=mesh;
      }

      const p=data[id];

      const offset=(BOARD_SIZE-1)/2;

      otherPlayers[id].position.x=
        (p.col-offset)*TILE_SIZE;

      otherPlayers[id].position.z=
        (p.row-offset)*TILE_SIZE;
    }
  });
}

</script>

</body>
</html>
